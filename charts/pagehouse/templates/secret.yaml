{{- if or .Values.postgresql.enabled (and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret)) }}
{{- $pw := include "pagehouse.dbPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pagehouse.secret" . }}
  labels: {{- include "pagehouse.labels" . | nindent 4 }}
  annotations:
    # Never deleted by `helm uninstall`: losing it would lock you out of the database.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  password: {{ $pw | quote }}
  url: {{ printf "postgres://pagehouse:%s@%s:5432/pagehouse" $pw (include "pagehouse.dbHost" .) | quote }}
  {{- else }}
  url: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
