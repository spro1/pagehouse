# Pagehouse: app + PostgreSQL + automatic backups. Works with `docker compose` and `podman compose`.
# Settings live in .env (see .env.example). To build from source instead of pulling the image,
# add `COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml` to .env.
services:
  db:
    # Official postgres:17-alpine, patched and without gosu (see docker/postgres/Dockerfile). Runs as the postgres user.
    image: ${PAGEHOUSE_POSTGRES_IMAGE:-localhost/pagehouse-postgres}:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: pagehouse
      POSTGRES_DB: pagehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagehouse -d pagehouse"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  app:
    image: ${PAGEHOUSE_IMAGE:-localhost/pagehouse}:${PAGEHOUSE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pagehouse:${POSTGRES_PASSWORD}@db:5432/pagehouse
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      PUBLIC_URL: ${PUBLIC_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-1}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-0}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-1}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LINK_PREVIEW: ${LINK_PREVIEW:-1}
      LINK_PREVIEW_ALLOW: ${LINK_PREVIEW_ALLOW:-}
      WEBHOOK_ALLOW: ${WEBHOOK_ALLOW:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      BACKUP_DIR: /backups
    volumes:
      - files:/data
      - ./backups:/backups:ro
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    stop_grace_period: 15s

  # Automatic backups: one at start, then every BACKUP_INTERVAL_HOURS, into ./backups on the host.
  # The host folder survives `down -v`; copy it off the server too. Same format as scripts/backup.sh.
  backup:
    image: ${PAGEHOUSE_POSTGRES_IMAGE:-localhost/pagehouse-postgres}:17
    # root only to write into ./backups, which belongs to the host user
    user: root
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: pagehouse
      PGDATABASE: pagehouse
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - files:/data:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # The policy is set in Admin → Overview → Backups (stored in the database); BACKUP_* above are the defaults.
        policy() {
          set -- $$(psql -Atc "SELECT coalesce((v->>'intervalHours')::int, $$BACKUP_INTERVAL_HOURS), coalesce((v->>'keep')::int, $$BACKUP_KEEP),
            coalesce((v->>'maxAgeDays')::int, 0), coalesce((v->>'manualMaxAgeDays')::int, 0)
            FROM (SELECT (SELECT value FROM settings WHERE key = 'backup') AS v) s" -F ' ' 2>/dev/null)
          interval=$${1:-$$BACKUP_INTERVAL_HOURS}; keep=$${2:-$$BACKUP_KEEP}; age=$${3:-0}; manual_age=$${4:-0}
        }
        while true; do
          policy
          name="pagehouse-auto-$$(date +%Y%m%d-%H%M%S)"
          work="/tmp/$$name"; mkdir -p "$$work"
          # A new install has no files folder until the first upload: then files.tar is an empty archive (10 KiB of
          # zeros; busybox tar won't create an empty one). Any other tar error still fails the backup.
          if { if [ -d /data/files ]; then tar -C /data -cf "$$work/files.tar" files; else head -c 10240 /dev/zero > "$$work/files.tar"; fi; } \
             && pg_dump -Fc -f "$$work/db.dump" \
             && tar -C "$$work" -czf "/backups/$$name.tar.gz.part" db.dump files.tar; then
            mv "/backups/$$name.tar.gz.part" "/backups/$$name.tar.gz"
            echo "backup written: $$name.tar.gz"
            # Only after a good backup: keep the newest $$keep automatic ones, then drop any older than the age limits.
            ls -1t /backups/pagehouse-auto-*.tar.gz | tail -n +$$((keep + 1)) | xargs -r rm -f
            [ "$$age" -gt 0 ] && find /backups -name 'pagehouse-auto-*.tar.gz' -mmin +$$((age * 1440)) -print -delete
            # Manual and pre-upgrade backups (pagehouse-YYYYmmdd-…) only when an admin set a limit for them.
            [ "$$manual_age" -gt 0 ] && find /backups -name 'pagehouse-*.tar.gz' ! -name 'pagehouse-auto-*' -mmin +$$((manual_age * 1440)) -print -delete
          else
            echo "BACKUP FAILED" >&2
            rm -f "/backups/$$name.tar.gz.part"
          fi
          rm -rf "$$work"
          # Wake every minute so a changed interval applies without a restart.
          waited=0
          while policy; [ $$waited -lt $$((interval * 3600)) ]; do sleep 60; waited=$$((waited + 60)); done
        done

volumes:
  db:
  files:
