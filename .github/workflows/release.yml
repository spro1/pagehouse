# Push a tag like v0.2.0 to publish:
#   - ghcr.io/<owner>/pagehouse:<version> and :latest (linux/amd64 + linux/arm64)
#   - a GitHub Release with install.sh, the compose bundle, offline bundles per architecture and the Helm chart
# If a release run fails for a reason outside the code, run this workflow by hand (Actions → Release → Run workflow)
# with the same tag: it rebuilds from that tag using the current workflow, without creating a new version.
name: Release

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0-beta.3
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  TAG: ${{ inputs.tag || github.ref_name }}
  # The build action's own build-record artifacts are not part of the release.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Version in package.json matches the tag
        run: test "$(node -p "require('./package.json').version")" = "${{ needs.meta.outputs.version }}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          # Pre-releases (v1.2.0-beta.1) never move :latest.
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.prerelease != 'true' && format('{0}:latest', needs.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: PostgreSQL image (patched, without gosu)
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.image }}-postgres:17

  bundles:
    needs: [meta, image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # One architecture per archive. `docker save` of a multi-arch image fails on missing manifests,
      # so skopeo (preinstalled on GitHub runners) copies exactly the platform we want.
      - name: Save ${{ matrix.arch }} images
        env:
          CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="release/pagehouse-${{ needs.meta.outputs.version }}/images"
          mkdir -p "$dir"
          skopeo copy --src-creds "$CREDS" --override-os linux --override-arch ${{ matrix.arch }} \
            docker://${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }} \
            docker-archive:"$dir/pagehouse.tar":${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
          skopeo copy --src-creds "$CREDS" --override-os linux --override-arch ${{ matrix.arch }} \
            docker://${{ needs.meta.outputs.image }}-postgres:17 \
            docker-archive:"$dir/postgres.tar":${{ needs.meta.outputs.image }}-postgres:17
      - name: Build bundles
        run: sh scripts/make-release.sh "${{ needs.meta.outputs.version }}" "${{ needs.meta.outputs.image }}" "${GITHUB_REPOSITORY}" --offline ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.arch }}
          path: |
            release/*.tar.gz
            release/install.sh

  publish:
    needs: [meta, bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Only our bundles: other artifacts in the run would collide when merged into one folder.
      - uses: actions/download-artifact@v7
        with:
          pattern: bundles-*
          path: release
          merge-multiple: true
      - uses: azure/setup-helm@v4
      - name: Package the Helm chart
        run: |
          sed -i "s#repository: ghcr.io/[^/]*/pagehouse\$#repository: ${{ needs.meta.outputs.image }}#" charts/pagehouse/values.yaml
          sed -i "s#image: ghcr.io/[^/]*/pagehouse-postgres:17#image: ${{ needs.meta.outputs.image }}-postgres:17#" charts/pagehouse/values.yaml
          helm package charts/pagehouse --version "${{ needs.meta.outputs.version }}" --app-version "${{ needs.meta.outputs.version }}" -d release
      - name: Checksums
        run: cd release && sha256sum *.tar.gz *.tgz install.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            release/install.sh
            release/pagehouse.tar.gz
            release/pagehouse-*.tar.gz
            release/pagehouse-*.tgz
            release/SHA256SUMS
