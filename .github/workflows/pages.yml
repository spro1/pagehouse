# Publishes the product page in site/ to GitHub Pages. main only moves at a release, so the page always
# describes the released version.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # deploy-pages reads the uploaded artifact's metadata
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble
        run: |
          mkdir -p _site/images
          cp site/*.html site/*.css site/*.js _site/
          cp docs/images/* _site/images/
      - uses: actions/upload-pages-artifact@v4   # v5 uploads with upload-artifact v7, which deploy-pages v5 does not find
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
